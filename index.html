<div class="app">
  <header>
    <div class="title">
      <h1>Legal NLP Projects: Uses &amp; Relations</h1>
      <p class="title-sub">Each project declares what it uses and produces, and shared uses reveal how projects relate.</p>
    </div>
    <nav class="tabs" aria-label="Views">
      <button class="tab active" data-view="projects">Projects</button>
      <button class="tab" data-view="relations">Relations</button>
      <button class="tab" data-view="catalogue">Catalogue</button>
    </nav>
  </header>

  <div class="appbody">
    <!-- PROJECTS -->
    <main class="view active" id="v_projects">
      <div class="projlayout">
        <aside class="plist">
          <div class="plist-h"><h2>Projects</h2></div>
          <div class="plist-body" id="projList"></div>
        </aside>
        <section class="pdetail" id="projDetail"></section>
      </div>
    </main>
    <!-- RELATIONS -->
    <main class="view" id="v_relations"><div class="scroll" id="relBody"></div></main>
    <!-- CATALOGUE -->
    <main class="view" id="v_catalogue"><div class="scroll" id="catBody"></div></main>
  </div>

<script>
"use strict";
/* ================= STATE ================= */
/* The prototype's storage key. Kept unchanged for reference: the published page deliberately never reads or writes it. */
const LS_KEY="legal_nlp_uses_v3";
let D;
function normalize(p){(p.projects||[]).forEach(pr=>{['uses','produces'].forEach(w=>{(pr[w]||[]).forEach(r=>{if(r.src)return;if(r.techs===undefined)r.techs=r.tech?[r.tech]:[];delete r.tech;if(r.datas===undefined)r.datas=r.data?[r.data]:[];delete r.data;});});});return p;}
/* Published data in git is the single source of truth (D20/D5): fetched over HTTP on startup. */
const DATA_URL="data/registry.json";
async function load(){const res=await fetch(DATA_URL,{cache:"no-store"});if(!res.ok)throw new Error("HTTP "+res.status);return normalize(await res.json());}

/* ================= HELPERS ================= */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function proj(){return D.projects.find(p=>p.id===D.current)||D.projects[0];}
const tech=id=>D.techniques.find(t=>t.id===id);
function compLeaf(id){for(const c of D.components){if(c.id===id)return{cls:c,sub:null};const s=(c.subs||[]).find(x=>x.id===id);if(s)return{cls:c,sub:s};}return null;}
function compName(id){const l=compLeaf(id);return l?(l.sub?l.cls.name+': '+l.sub.name:l.cls.name):'?';}
function dataInfo(id){for(const ds of D.dataSources){if(ds.id===id)return{cls:ds,sub:null};const s=(ds.subs||[]).find(x=>x.id===id);if(s)return{cls:ds,sub:s};}return null;}
function dataLabel(id){const di=dataInfo(id);return di?(di.sub?di.cls.name+': '+di.sub.name:di.cls.name):'';}
/* a Uses row may reference another project's Produces row via .src.
   .src.data (optional) narrows to a specific configuration (single data sub-class) of that produced row. */
function resolveRow(r){if(r&&r.src){const p=D.projects.find(x=>x.id===r.src.proj);const pr=p&&(p.produces||[]).find(x=>x.id===r.src.row);if(!pr)return null;if(r.src.data)return {id:pr.id,comp:pr.comp,datas:[r.src.data],techs:pr.techs||[]};return pr;}return r;}
function techNames(ids){return (ids||[]).map(id=>{const t=tech(id);return t?t.name:null;}).filter(Boolean);}
function dataNames(ids){return (ids||[]).map(dataLabel).filter(Boolean);}
function comboLabel(r){if(!r)return '<span class="ct">(removed)</span>';let h='<span class="ct">'+esc(compName(r.comp));const dl=dataNames(r.datas);if(dl.length)h+=', <span class="d">'+esc(dl.join(', '))+'</span>';const ts=techNames(r.techs);if(ts.length)h+=', <span class="t">'+esc(ts.join(', '))+'</span>';h+='</span>';return h;}
function splitKey(k){const i=k.indexOf('|');return [k.slice(0,i),k.slice(i+1)];}

/* how many projects reference a component class or sub-class (uses resolved + produces) */
function compUsage(cid){const c=D.components.find(x=>x.id===cid);let ids=[cid];if(c&&c.subs)ids=ids.concat(c.subs.map(s=>s.id));let n=0;for(const p of D.projects){const rows=[...p.uses.map(resolveRow).filter(Boolean),...p.produces];if(rows.some(r=>ids.includes(r.comp)))n++;}return n;}
/* is a given use-row's component shared with another project? (weakest level) */
function rowShared(pid,r){const rr=resolveRow(r);if(!rr)return false;for(const p of D.projects){if(p.id===pid)continue;if(p.uses.some(x=>{const xx=resolveRow(x);return xx&&xx.comp===rr.comp;}))return true;}return false;}

/* ================= RELATIONS ENGINE =================
   Three tie levels (nested):
   weak     = share a component sub-class            (comp)
   moderate = share component x data sub-class       (comp x data)
   strong   = also share a technique                 (comp x data x technique)
   A pair's tie type is the strongest level it reaches on any shared combination. */
function projInfo(p){
  const comps=new Set(); const md=new Map();
  p.uses.forEach(r=>{const rr=resolveRow(r);if(!rr)return;comps.add(rr.comp);(rr.datas||[]).forEach(d=>{if(!d)return;const k=rr.comp+'|'+d;if(!md.has(k))md.set(k,new Set());(rr.techs||[]).forEach(t=>md.get(k).add(t));});});
  return {comps,md};
}
function computeTies(){
  const ps=D.projects, ties=[], info=ps.map(projInfo);
  const rank={weak:1,moderate:2,strong:3};
  for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){
    const A=info[i],B=info[j], combos=[], mdComps=new Set();
    let hasWeak=false,hasModerate=false,hasStrong=false;
    [...A.md.keys()].filter(k=>B.md.has(k)).forEach(k=>{
      const inter=[...A.md.get(k)].filter(t=>B.md.get(k).has(t)); const [comp,data]=splitKey(k); mdComps.add(comp);
      if(inter.length){hasStrong=true;combos.push({comp,data,techs:inter,level:'strong'});}
      else{hasModerate=true;combos.push({comp,data,techs:[],level:'moderate'});}
    });
    [...A.comps].filter(c=>B.comps.has(c)).forEach(c=>{ if(!mdComps.has(c)){hasWeak=true;combos.push({comp:c,data:'',techs:[],level:'weak'});} });
    if(!combos.length) continue;
    const type=hasStrong?'strong':(hasModerate?'moderate':'weak');
    combos.sort((x,y)=>rank[y.level]-rank[x.level]);
    ties.push({a:ps[i].id,b:ps[j].id,type,combos});
  }
  return ties;
}
function rowKeys(r){const ds=(r.datas||[]).filter(Boolean);return ds.length?ds.map(d=>r.comp+'|'+d):[r.comp+'|'];}
function computeSupply(){
  const ps=D.projects,out=[];
  for(const a of ps){ if(!a.produces.length)continue;
    const pk=new Set(); a.produces.forEach(r=>rowKeys(r).forEach(k=>pk.add(k)));
    for(const b of ps){ if(a===b)continue;
      const via=b.uses.map(resolveRow).filter(r=>r&&rowKeys(r).some(k=>pk.has(k)));
      if(via.length) out.push({from:a.id,to:b.id,combos:via});
    }
  }
  return out;
}

/* ================= PROJECTS TAB ================= */
function renderProjectList(){
  const el=document.getElementById('projList'); el.innerHTML='';
  D.projects.forEach(p=>{
    const div=document.createElement('div'); div.className='pitem'+(p.id===D.current?' active':'');
    div.innerHTML='<span class="nm">'+esc(p.name)+'</span><span class="u">'+p.produces.length+'p / '+p.uses.length+'u</span>';
    div.onclick=()=>{D.current=p.id;renderProjectList();renderProjectDetail();};
    el.appendChild(div);
  });
}
function dataChips(r){return (r.datas||[]).map(id=>'<span class="dchip">'+esc(dataLabel(id)||'?')+'</span>').join(' ');}
function techChips(r){return (r.techs||[]).map(id=>{const t=tech(id);return '<span class="tchip">'+esc(t?t.name:'?')+'</span>';}).join(' ');}
function rowTable(p,which){
  const rows=p[which];
  let h='<table class="rowtable"><thead><tr><th class="col-comp">Component (tool)</th><th class="col-data">Data sub-class(es)</th><th class="col-tech">Technique(s)</th></tr></thead><tbody>';
  if(!rows.length) h+='<tr><td colspan="3" class="empty">None declared.</td></tr>';
  rows.forEach(r=>{
    if(which==='uses'&&r.src){
      const rr=resolveRow(r); const srcP=D.projects.find(x=>x.id===r.src.proj); const srcLbl=r.src.proj===D.current?'this project':(srcP?srcP.name:'?');
      h+='<tr><td colspan="3"><span class="fromtag">From '+esc(srcLbl)+':</span> '+comboLabel(rr)+'</td></tr>';
      return;
    }
    const shared=(which==='uses')&&rowShared(p.id,r);
    h+='<tr><td>'+esc(compName(r.comp))+(shared?'<span class="badge-shared" title="Shared with another project">shared</span>':'')+'</td>'+
       '<td><div class="techcell">'+dataChips(r)+'</div></td>'+
       '<td><div class="techcell">'+techChips(r)+'</div></td></tr>';
  });
  h+='</tbody></table>';
  return h;
}
function renderProjectDetail(){
  const el=document.getElementById('projDetail'); const p=proj();
  const tCls=p.type==='research'?'type-research':'type-software';
  el.innerHTML=
    '<div class="pdetail-h"><b id="pname">'+esc(p.name)+'</b>'+
    '<span class="pill '+tCls+'">'+(p.type==='research'?'Research':'Software')+'</span></div>'+
    (p.description?'<p class="sub-note pdesc">'+esc(p.description)+'</p>':'')+
    '<div class="rowsec"><div class="h"><b>Produces</b><small>what this project outputs (may feed other projects)</small></div>'+rowTable(p,'produces')+'</div>'+
    '<div class="rowsec"><div class="h"><b>Uses</b><small>component (+ data sub-class + technique), or another project’s output</small></div>'+rowTable(p,'uses')+'</div>'+
    '<p class="sub-note">Relations are computed from these rows: a <b>weak tie</b> shares a component sub-class; a <b>moderate tie</b> shares component and data sub-class; a <b>strong tie</b> also shares a technique; a <b>supply</b> is one project producing what another uses. This page is read-only: changes are made by pull request to <code>data/registry.json</code>.</p>';
}

/* ================= RELATIONS TAB ================= */
let relFilter={weak:true,moderate:true,strong:true,supply:true};
const rankOf={weak:1,moderate:2,strong:3};
function renderRelations(){
  const b=document.getElementById('relBody');
  const ties=computeTies(), supply=computeSupply();
  let h='<h2 class="vh">Relations</h2><p class="sub-note">Nothing is drawn by hand. Every tie is derived from the projects’ rows. <b>Weak</b> means a shared component sub-class. <b>Moderate</b> means a shared component and data sub-class. <b>Strong</b> means they also share a technique. <b>Supply</b> means one project produces what another uses.</p>';
  h+='<div class="checks"><span class="pill">'+D.projects.length+' projects</span>'+
    '<label><input type="checkbox" id="f_weak" '+(relFilter.weak?'checked':'')+'> <span class="rb weak">weak tie</span></label>'+
    '<label><input type="checkbox" id="f_moderate" '+(relFilter.moderate?'checked':'')+'> <span class="rb moderate">moderate tie</span></label>'+
    '<label><input type="checkbox" id="f_strong" '+(relFilter.strong?'checked':'')+'> <span class="rb strong">strong tie</span></label>'+
    '<label><input type="checkbox" id="f_supply" '+(relFilter.supply?'checked':'')+'> <span class="rb supply">supply</span></label></div>';
  const showTies=ties.filter(t=>relFilter[t.type]);
  const showSupply=relFilter.supply?supply:[];
  if(!showTies.length&&!showSupply.length){
    h+='<div class="empty-big">No relations to show.</div>';
    b.innerHTML=h; wireRel(); return;
  }
  const cnt={strong:0,moderate:0,weak:0}; showTies.forEach(t=>cnt[t.type]++);
  h+='<div class="checks"><span class="pill"><b>'+cnt.strong+'</b> strong</span><span class="pill"><b>'+cnt.moderate+'</b> moderate</span><span class="pill"><b>'+cnt.weak+'</b> weak</span><span class="pill"><b>'+showSupply.length+'</b> supply</span></div>';
  h+='<p class="sub-note">Each cell shows the relationship between the <b>row</b> project and the <b>column</b> project. <span class="sarrow">\u25b8</span> means the <b>row supplies the column</b> (produces what it uses); <span class="tglyph tglyph--strong">\u2194</span> means they <b>share</b> a component or data configuration. <b>Hover a cell</b> to see what is shared or supplied. (Tie strength appears as a subtle cell tint.)</p>';
  h+=relMatrix(showTies,showSupply);
  h+='<h3 class="sec-h">Details</h3>';
  h+='<div class="edgetable-wrap"><table class="edgetable"><thead><tr><th>Project A</th><th>Relation</th><th>Project B</th><th>Shared combination(s)</th></tr></thead><tbody>';
  showSupply.forEach(s=>{
    const combos=s.combos.map(r=>comboLabel(r)).join(' ');
    h+='<tr><td><b>'+esc(pn(s.from))+'</b></td><td><span class="rb supply">supplies \u25b6</span></td><td><b>'+esc(pn(s.to))+'</b></td><td><span class="combo">'+combos+'</span></td></tr>';
  });
  showTies.slice().sort((x,y)=>rankOf[y.type]-rankOf[x.type]).forEach(t=>{
    const combos=t.combos.map(c=>{let s='<span class="ct" title="'+c.level+' match">'+esc(compName(c.comp));if(c.data){const dl=dataLabel(c.data);if(dl)s+=', <span class="d">'+esc(dl)+'</span>';}if(c.level==='strong'&&c.techs.length)s+=', <span class="t">'+esc(techNames(c.techs).join(', '))+'</span>';s+='</span>';return s;}).join(' ');
    h+='<tr><td><b>'+esc(pn(t.a))+'</b></td><td><span class="rb shares">shares</span> <span class="lvl '+t.type+'">'+t.type+'</span></td><td><b>'+esc(pn(t.b))+'</b></td><td><span class="combo">'+combos+'</span></td></tr>';
  });
  h+='</tbody></table></div>';
  b.innerHTML=h;
  wireRel();
}
function pn(id){const p=D.projects.find(x=>x.id===id);return p?p.name:id;}
function wireRel(){const m={f_weak:'weak',f_moderate:'moderate',f_strong:'strong',f_supply:'supply'};Object.keys(m).forEach(id=>{const el=document.getElementById(id);if(el)el.onchange=()=>{relFilter[m[id]]=el.checked;renderRelations();};});}
function comboPlain(c){let s=compName(c.comp);if(c.data)s+=', '+dataLabel(c.data);if(c.level==='strong'&&c.techs&&c.techs.length)s+=', '+techNames(c.techs).join(', ');return s;}
function relMatrix(ties,supply){
  const ps=D.projects;
  const tieOf={}; ties.forEach(t=>{tieOf[t.a+'|'+t.b]=t;tieOf[t.b+'|'+t.a]=t;});
  const supOf={}; supply.forEach(s=>{supOf[s.from+'|'+s.to]=s;});
  let h='<div class="matrix-wrap"><table class="relmatrix"><thead><tr><th class="corner">Row to column</th>';
  ps.forEach((p,i)=>{h+='<th title="'+esc(p.name)+'">'+(i+1)+'</th>';});
  h+='</tr></thead><tbody>';
  ps.forEach((r,ri)=>{
    h+='<tr><td class="rowh" title="'+esc(r.name)+'"><span class="idx">'+(ri+1)+'.</span> '+esc(r.name)+'</td>';
    ps.forEach((c,ci)=>{ if(ri===ci){h+='<td class="diag"></td>';return;}
      const t=tieOf[r.id+'|'+c.id], sup=supOf[r.id+'|'+c.id]; const title=[]; let glyph='';
      if(sup){glyph+='<span class="sarrow">\u25b8</span>';title.push(esc(r.name)+' supplies '+esc(c.name)+': '+esc(sup.combos.map(x=>compName(x.comp)+(dataNames(x.datas).length?', '+dataNames(x.datas).join(', '):'')).join(' ; ')));}
      if(t){glyph+='<span class="tglyph tglyph--'+t.type+'">\u2194</span>';title.push(esc(r.name)+' shares with '+esc(c.name)+' ('+t.type+'): '+esc(t.combos.map(comboPlain).join(' ; ')));}
      const cls=t?(' mcell--'+t.type):'';
      h+='<td class="mcell'+cls+'" title="'+title.join('  |  ')+'">'+glyph+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="mlegend"><span><span class="sarrow">\u25b8</span> supplies (row to column)</span><span><span class="tglyph tglyph--strong">\u2194</span> shares a configuration</span><span>cell tint indicates tie strength</span></div>';
  return h;
}

/* ================= CATALOGUE TAB ================= */
function renderCatalogue(){
  const b=document.getElementById('catBody');
  let h='<h2 class="vh">Catalogue</h2><p class="sub-note">The shared building blocks every project draws on. Read-only: changes are made by pull request to <code>data/registry.json</code>.</p><div class="cat-grid">';
  h+='<div class="catbox"><div class="h"><b>Data sources</b></div><div class="body" id="catData">';
  D.dataSources.forEach(ds=>{ h+='<div class="citem" data-ds="'+ds.id+'"><span class="nm">'+esc(ds.name)+'</span></div>';
    (ds.subs||[]).forEach(s=>{h+='<div class="citem sub" data-ds="'+ds.id+'" data-sub="'+s.id+'"><span class="nm">'+esc(s.name)+'</span><span class="use">'+subUsage(s.id)+' use(s)</span></div>';});
  });
  h+='</div></div>';
  h+='<div class="catbox"><div class="h"><b>Techniques</b></div><div class="body" id="catTech">';
  D.techniques.forEach(t=>{h+='<div class="citem" data-t="'+t.id+'"><span class="nm">'+esc(t.name)+'</span><span class="use">'+techUsage(t.id)+' use(s)</span></div>';});
  h+='</div></div>';
  h+='<div class="catbox"><div class="h"><b>Components (tools)</b></div><div class="body" id="catComp">';
  D.components.forEach(c=>{ h+='<div class="citem" data-c="'+c.id+'"><span class="nm">'+esc(c.name)+'</span><span class="use">'+compUsage(c.id)+' proj</span></div>';
    (c.subs||[]).forEach(s=>{h+='<div class="citem sub" data-c="'+c.id+'" data-sub="'+s.id+'"><span class="nm">'+esc(s.name)+'</span><span class="use">'+compUsage(s.id)+'</span></div>';});
  });
  h+='</div></div>';
  h+='</div>';
  b.innerHTML=h;
}
function subUsage(sid){let n=0;for(const p of D.projects){const rows=[...p.uses.map(resolveRow).filter(Boolean),...p.produces];if(rows.some(r=>(r.datas||[]).includes(sid)))n++;}return n;}
function techUsage(tid){let n=0;for(const p of D.projects){const rows=[...p.uses.map(resolveRow).filter(Boolean),...p.produces];if(rows.some(r=>(r.techs||[]).includes(tid)))n++;}return n;}
/* ================= VIEWS ================= */
let view='projects';
function setView(v){view=v;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));['projects','relations','catalogue'].forEach(x=>document.getElementById('v_'+x).classList.toggle('active',x===v));if(v==='relations')renderRelations();if(v==='catalogue')renderCatalogue();}
function render(){renderProjectList();renderProjectDetail();if(view==='relations')renderRelations();if(view==='catalogue')renderCatalogue();}

/* ================= TABS ================= */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setView(t.dataset.view));

/* ================= INIT ================= */
/* Missing or malformed data: replace the whole body with one clear message instead of a blank or half-drawn page. */
function showDataUnavailable(e){const el=document.createElement('div');el.className='empty-big';el.setAttribute('role','alert');el.textContent='Data unavailable. The registry data could not be loaded ('+(e&&e.message||e)+'). Please try again later.';document.querySelector('.appbody').replaceChildren(el);}
load().then(d=>{D=d;render();}).catch(showDataUnavailable);
</script>

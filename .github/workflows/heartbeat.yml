name: Weekly heartbeat

# GitHub disables scheduled workflows in public repos after 60 days without
# repository activity, which would silently stop the nightly FAIR check. Once a
# week this commits status/heartbeat.json (timestamp + last FAIR run result) to
# main so the schedule stays alive.
#
# No deploy loop: pushes made with GITHUB_TOKEN do not trigger other workflows,
# and pages.yml also ignores status/** on push in case this ever uses an App token.
on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    # Never push to main from a run dispatched on another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the heartbeat commit
      actions: read # read fair.yml's latest run
    steps:
      # persist-credentials stays on (unlike every other job): this job must
      # `git push` the heartbeat commit, and the persisted GITHUB_TOKEN is how it
      # authenticates. Nothing in this job uploads artifacts or runs third-party
      # code: it uses no npm dependencies and skips `npm ci`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Write status/heartbeat.json
        run: npm run heartbeat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push (skipped when unchanged)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/heartbeat.json
          if git diff --cached --quiet; then
            echo 'Heartbeat unchanged; nothing to commit.'
            exit 0
          fi
          git commit -m 'Heartbeat: keep scheduled workflows alive'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt $attempt); rebasing onto main."
            git pull --rebase origin main
          done
          echo 'Could not push the heartbeat after 3 attempts.' >&2
          exit 1
